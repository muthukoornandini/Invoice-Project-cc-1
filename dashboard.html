<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice Management System - Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/dashboard.css">

</head>


<body>


<div class="d-flex">


<!-- Sidebar -->

<div class="sidebar">

<h2 class="text-center text-white py-4">IMS</h2>


<a href="./dashboard.html">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>


<a href="./customers.html">
<i class="bi bi-people-fill"></i>
Customers
</a>


<a href="./invoices.html">
<i class="bi bi-receipt"></i>
Invoices
</a>


<a href="./reports.html">
<i class="bi bi-bar-chart-fill"></i>
Reports
</a>


<a href="./login.html">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>


</div>




<!-- Content -->

<div class="content">


<nav class="navbar bg-white shadow-sm p-3">

<h2>Dashboard</h2>

<span class="fw-bold">
Welcome Admin
</span>

</nav>





<div class="container mt-4">


<div class="row g-4">



<div class="col-md-3">

<div class="card bg-primary text-white p-4">

<h4>Total Customers</h4>

<h1 id="totalCustomers">0</h1>

</div>

</div>




<div class="col-md-3">

<div class="card bg-success text-white p-4">

<h4>Total Invoices</h4>

<h1 id="totalInvoices">0</h1>

</div>

</div>




<div class="col-md-3">

<div class="card bg-warning text-dark p-4">

<h4>Revenue</h4>

<h1 id="totalRevenue">₹0</h1>

</div>

</div>




<div class="col-md-3">

<div class="card bg-danger text-white p-4">

<h4>Pending</h4>

<h1 id="pendingInvoices">0</h1>

</div>

</div>



</div>





<div class="card mt-4">


<div class="card-header bg-dark text-white">

<h5 class="mb-0">
Recent Invoices
</h5>

</div>




<div class="card-body">


<table class="table table-bordered table-hover">


<thead class="table-dark">

<tr>

<th>Invoice No</th>

<th>Customer</th>

<th>Amount</th>

<th>Status</th>

</tr>

</thead>



<tbody id="invoiceTable">


</tbody>



</table>


</div>


</div>



</div>



</div>



</div>






<script>


fetch("http://localhost:5000/api/dashboard")


.then(response => response.json())


.then(data => {


console.log(data);



document.getElementById("totalCustomers").innerHTML =
data.customers;



document.getElementById("totalInvoices").innerHTML =
data.invoices;



document.getElementById("totalRevenue").innerHTML =
"₹" + data.revenue;





let rows = "";



if(data.recentInvoices && data.recentInvoices.length > 0)
{


data.recentInvoices.forEach(invoice => {


rows += `


<tr>


<td>${invoice.invoice_number}</td>


<td>${invoice.customer_name}</td>


<td>₹${invoice.total_amount}</td>


<td>

<span class="badge bg-success">

${invoice.status}

</span>

</td>


</tr>


`;


});


}

else

{


rows = `

<tr>

<td colspan="4" class="text-center">

No invoices found

</td>

</tr>

`;

}



document.getElementById("invoiceTable").innerHTML = rows;



})


.catch(error => {


console.log("Dashboard Error:", error);


});



</script>



</body>

</html>
