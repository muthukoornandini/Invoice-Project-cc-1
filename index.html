<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(135deg,#0d6efd,#4facfe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card-box{
            width:90%;
            max-width:700px;
            background:#fff;
            padding:50px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        h1{
            color:#0d6efd;
            font-weight:bold;
        }

        p{
            color:#555;
            font-size:18px;
            margin-top:20px;
        }

        .btn-login{
            margin-top:30px;
            padding:12px 35px;
            font-size:18px;
            border-radius:30px;
        }

        .icon{
            font-size:70px;
            color:#0d6efd;
        }
    </style>

</head>

<body>

<div class="card-box">

<i class="bi bi-receipt-cutoff icon"></i>

<h1>Invoice Management System</h1>

<p>
Manage Customers, Invoices and Reports efficiently with a simple and professional dashboard.
</p>

<a href="login.html" class="btn btn-primary btn-login">
<i class="bi bi-box-arrow-in-right"></i>
Go to Login
</a>

</div>

</body>
</html>
