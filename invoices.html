<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="d-flex">

<div class="sidebar">

<h3 class="text-center text-white mt-3">IMS</h3>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="customers.html"><i class="bi bi-people-fill"></i> Customers</a>
<a href="invoices.html"><i class="bi bi-receipt"></i> Invoices</a>
<a href="reports.html"><i class="bi bi-bar-chart-fill"></i> Reports</a>
<a href="login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="content">

<nav class="navbar bg-white shadow-sm p-3">
<h3>Invoice Management</h3>
</nav>

<div class="container mt-4">

<!-- Add Invoice -->

<div class="card mb-4">

<div class="card-header bg-success text-white">
Add Invoice
</div>

<div class="card-body">

<form id="invoiceForm">

<div class="row">

<div class="col-md-4 mb-3">
<input type="text" id="invoice_number" class="form-control" placeholder="Invoice Number" required>
</div>

<div class="col-md-4 mb-3">
<input type="text" id="customer_name" class="form-control" placeholder="Customer Name" required>
</div>

<div class="col-md-4 mb-3">
<input type="date" id="invoice_date" class="form-control" required>
</div>

<div class="col-md-4 mb-3">
<input type="number" id="total_amount" class="form-control" placeholder="Total Amount" required>
</div>

<div class="col-md-4 mb-3">
<select id="status" class="form-select">

<option value="Paid">Paid</option>
<option value="Pending">Pending</option>

</select>
</div>

<div class="col-md-4 mb-3">

<button type="submit" class="btn btn-success w-100">
Add Invoice
</button>

</div>

</div>

</form>

</div>

</div>

<!-- Invoice Table -->

<div class="card">

<div class="card-header bg-success text-white">
Invoice List
</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Invoice No</th>
<th>Customer</th>
<th>Date</th>
<th>Total</th>
<th>Status</th>

</tr>

</thead>

<tbody id="invoiceTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<script src="js/invoice.js"></script>

</body>
</html>
